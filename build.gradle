plugins {
	id 'java'
	id 'eclipse'
	id 'jacoco'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'jakarta.json:jakarta.json-api:2.1.3'
	implementation 'org.glassfish:jakarta.json:2.0.1'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport 
}